# Construye las imágenes Docker en GitHub y las publica en ghcr.io, para que
# el VPS no tenga que compilar nada (solo descarga la imagen del commit).
# Una sola imagen sirve para todas las instancias del VPS (cdemo, roxo, ...):
# el frontend usa rutas relativas (/api/v1) y cada instancia pone su dominio
# y secretos en su propio .env, que nunca entra a la imagen.
name: Imagenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos push seguidos, el build viejo se cancela.
concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        id: imagen
        # ghcr.io exige minúsculas (el repo es felipe4563/CODECULINARY).
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeculinary-${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
            ${{ steps.imagen.outputs.nombre }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Relativa: el nginx del contenedor frontend reenvía /api al backend
          # de su misma instancia. Así la imagen no queda atada a un dominio.
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
